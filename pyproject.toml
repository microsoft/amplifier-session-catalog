[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amplifier-session-catalog"
version = "0.1.0"
description = "Rebuildable, disk-indexed discovery for native agent sessions"
requires-python = ">=3.11"
license = "MIT"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
amplifier-session-catalog = "amplifier_session_catalog.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_session_catalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
